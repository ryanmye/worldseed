name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Some simulation tests run a full 2000-year history and can exceed vitest's
      # default 5s per-test timeout on a loaded CI runner; raise it for this job only.
      - run: npx vitest run --testTimeout=300000

      - run: npm run build

      # The site is served from https://<owner>.github.io/worldseed/, so the published
      # build needs that base path; only pushes to main are published.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx vite build --base=/worldseed/

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Publish to GitHub Pages only after typecheck, tests and build have passed.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
