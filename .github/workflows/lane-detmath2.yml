# TEMPORARY (lane/detmath2): CI's build job on this lane branch only, on Node 22 and Node 25 (the detMath ports must match
# Math.* on both, and G0 must hold on both). Drop this file when the lane merges.
name: lane-detmath2

on:
  push:
    branches: [lane/detmath2]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node -v && uname -m
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run --testTimeout=300000
      - run: npm run build
      - run: node --experimental-strip-types --no-warnings scripts/g0.ts
